[project]
name = "memmap"
version = "0.3.0"
description = "Turn a YAML description of an MCU memory layout into a datasheet-style memory map image."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.2",
    "pydantic>=2.9",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
memmap = "memmap.cli:app"

[project.optional-dependencies]
raster = [
    "cairosvg>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memmap"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "memmap/AGENTS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["ANN"]
ignore = [
    "ANN401",  # raw YAML values and pydantic models are Any by nature
    "TRY004",  # pydantic validators must raise ValueError, even for a wrong type
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
files = ["memmap"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cairosvg"]  # optional extra with no type stubs
ignore_missing_imports = true

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
