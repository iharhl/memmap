# Generated by `memmap from-partitions` from arduino_default.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 4 MB, from --flash-size.
# Partition table at 0x8000, from the default.
# Bootloader at 0x1000, from CONFIG_IDF_TARGET esp32 in sdkconfig.
version: 1

figure:
  title: "arduino_default.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 4M
      sectors: { size: 4K, count: 1024 }  # checks alignment (W100)
      children:
        - { id: "reserved", name: "Reserved", kind: reserved, start: 0x00000000, size: 4K }
        - { id: "bootloader", name: "Bootloader", start: 0x00001000, size: 28K }
        - { id: "partition_table", name: "Partition table", start: 0x00008000, size: 4K }
        - { id: "nvs", name: "nvs", start: 0x00009000, size: 20K, note: "data, nvs" }
        - { id: "otadata", name: "otadata", start: 0x0000E000, size: 8K, note: "data, ota" }
        - { id: "app0", name: "app0", start: 0x00010000, size: 1280K, note: "app, ota_0" }
        - { id: "app1", name: "app1", start: 0x00150000, size: 1280K, note: "app, ota_1" }
        - { id: "spiffs", name: "spiffs", start: 0x00290000, size: 1408K, note: "data, spiffs" }
        - { id: "coredump", name: "coredump", start: 0x003F0000, size: 64K, note: "data, coredump" }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n4 MB of 4 MB (99%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
