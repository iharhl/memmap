# Generated by `memmap from-partitions` from partitions.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 2 MB, from CONFIG_ESPTOOLPY_FLASHSIZE in sdkconfig.
# Partition table at 0x8000, from CONFIG_PARTITION_TABLE_OFFSET in sdkconfig.
# Bootloader at 0x0, from CONFIG_BOOTLOADER_OFFSET_IN_FLASH in sdkconfig.
version: 1

figure:
  title: "partitions.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 2M
      sectors: { size: 4K, count: 512 }  # checks alignment (W100)
      children:
        - { id: "bootloader", name: "Bootloader", start: 0x00000000, size: 32K }
        - { id: "partition_table", name: "Partition table", start: 0x00008000, size: 4K }
        - { id: "nvs", name: "nvs", start: 0x00009000, size: 24K, note: "data, nvs" }
        - { id: "phy_init", name: "phy_init", start: 0x0000F000, size: 4K, note: "data, phy" }
        - { id: "factory", name: "factory", start: 0x00010000, size: 550K, note: "app, factory" }
        - { id: "free", name: "Free\n2 KB", kind: reserved, start: 0x00099800, size: 2K }
        - { id: "zb_storage", name: "zb_storage", start: 0x0009A000, size: 16K, note: "data, fat" }
        - { id: "zb_fct", name: "zb_fct", start: 0x0009E000, size: 1K, note: "data, fat" }
        - { id: "free_2", name: "Free\n1415 KB", kind: reserved, start: 0x0009E400, size: 1415K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n631 KB of 2 MB (31%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
