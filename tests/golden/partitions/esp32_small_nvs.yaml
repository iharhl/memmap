# Generated by `memmap from-partitions` from partitions.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 4 MB, from CONFIG_ESPTOOLPY_FLASHSIZE in sdkconfig.
# Partition table at 0x8000, from CONFIG_PARTITION_TABLE_OFFSET in sdkconfig.
# Bootloader at 0x1000, from CONFIG_BOOTLOADER_OFFSET_IN_FLASH in sdkconfig.
version: 1

figure:
  title: "partitions.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 4M
      sectors: { size: 4K, count: 1024 }  # checks alignment (W100)
      children:
        - { id: "reserved", name: "Reserved", kind: reserved, start: 0x00000000, size: 4K }
        - { id: "bootloader", name: "Bootloader", start: 0x00001000, size: 28K }
        - { id: "partition_table", name: "Partition table", start: 0x00008000, size: 4K }
        - { id: "nvs", name: "nvs", start: 0x00009000, size: 8K, note: "data, nvs" }
        - { id: "otadata", name: "otadata", start: 0x0000B000, size: 8K, note: "data, ota" }
        - { id: "phy_init", name: "phy_init", start: 0x0000D000, size: 4K, note: "data, phy" }
        - { id: "free", name: "Free\n8 KB", kind: reserved, start: 0x0000E000, size: 8K }
        - { id: "ota_0", name: "ota_0", start: 0x00010000, size: 1920K, note: "app, ota_0" }
        - { id: "ota_1", name: "ota_1", start: 0x001F0000, size: 1920K, note: "app, ota_1" }
        - { id: "storage0", name: "storage0", start: 0x003D0000, size: 128K, note: "data, spiffs" }
        - { id: "storage1", name: "storage1", start: 0x003F0000, size: 12K, note: "data, spiffs" }
        - { id: "storage2", name: "storage2", start: 0x003F3000, size: 12K, note: "data, spiffs" }
        - { id: "free_2", name: "Free\n40 KB", kind: reserved, start: 0x003F6000, size: 40K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n3.9 MB of 4 MB (99%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
