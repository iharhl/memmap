# Generated by `memmap from-partitions` from zephyr.dts, a Zephyr devicetree.
# Each flash with fixed partitions is a region at the address its reg gives. A flash on a
# SPI or QSPI bus has no CPU address, so its offsets are positions in the chip, from 0.
# Rename, merge or annotate blocks freely.
# flash0, /soc/flash-controller@40022000/flash@8000000: 1 MB at 0x8000000, from its reg; 2 KB erase blocks.
# mx25r6435f, /soc/quadspi@a0001000/qspi-nor-flash@90000000: 8 MB at 0x0, from the size in its reg, drawn from 0 as partitions count from 0.
version: 1

figure:
  title: "zephyr.dts flash layout"

memory:
  regions:
    - id: "flash0"
      name: "flash0"
      start: 0x08000000
      size: 1M
      sectors: { size: 2K, count: 512 }  # checks alignment (W100)
      children:
        - { id: "boot_partition", name: "mcuboot", start: 0x08000000, size: 64K, note: "MCUboot, read-only" }
        - { id: "free", name: "Free\n64 KB", kind: reserved, start: 0x08010000, size: 64K }
        - { id: "slot0_partition", name: "image-0", start: 0x08020000, size: 864K, note: "MCUboot primary slot, code partition" }
        - { id: "scratch_partition", name: "image-scratch", start: 0x080F8000, size: 16K, note: "MCUboot scratch" }
        - { id: "free_2", name: "Free\n16 KB", kind: reserved, start: 0x080FC000, size: 16K }
    - id: "mx25r6435f"
      name: "mx25r6435f"
      space: "mx25r6435f"  # offsets in the chip, not CPU addresses
      start: 0x00000000
      size: 8M
      children:
        - { id: "slot1_partition", name: "image-1", start: 0x00000000, size: 864K, note: "MCUboot secondary slot" }
        - { id: "storage_partition", name: "storage", start: 0x000D8000, size: 7M }
        - { id: "free_3", name: "Free\n160 KB", kind: reserved, start: 0x007D8000, size: 160K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash0_col", root: "flash0", title: "flash0\n944 KB of 1 MB (92%)", width: 150 }
    - { id: "mx25r6435f_col", root: "mx25r6435f", title: "mx25r6435f\n7.8 MB of 8 MB (98%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false  # erase blocks are too many to mark
