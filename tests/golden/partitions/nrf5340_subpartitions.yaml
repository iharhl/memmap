# Generated by `memmap from-partitions` from zephyr.dts, a Zephyr devicetree.
# Each flash with fixed partitions is a region at the address its reg gives. A flash on a
# SPI or QSPI bus has no CPU address, so its offsets are positions in the chip, from 0.
# Rename, merge or annotate blocks freely.
# flash0, /soc/peripheral@40000000/flash-controller@39000/flash@0: 1 MB at 0x0, from its reg; 4 KB erase blocks.
version: 1

figure:
  title: "zephyr.dts flash layout"

memory:
  regions:
    - id: "flash0"
      name: "flash0"
      start: 0x00000000
      size: 1M
      sectors: { size: 4K, count: 256 }  # checks alignment (W100)
      children:
        - { id: "boot_partition", name: "mcuboot", start: 0x00000000, size: 64K, note: "MCUboot" }
        - id: "slot0_partition"
          name: "image-0"
          start: 0x00010000
          size: 448K
          note: "MCUboot primary slot"
          children:
            - { id: "slot0_s_partition", name: "image-0-secure", start: 0x00010000, size: 256K }
            - { id: "slot0_ns_partition", name: "image-0-nonsecure", start: 0x00050000, size: 192K, note: "MCUboot primary slot, non-secure image, code partition" }
        - id: "slot1_partition"
          name: "image-1"
          start: 0x00080000
          size: 448K
          note: "MCUboot secondary slot"
          children:
            - { id: "slot1_s_partition", name: "image-1-secure", start: 0x00080000, size: 256K }
            - { id: "slot1_ns_partition", name: "image-1-nonsecure", start: 0x000C0000, size: 192K, note: "MCUboot secondary slot, non-secure image" }
        - { id: "tfm_ps_partition", name: "tfm-ps", start: 0x000F0000, size: 16K }
        - { id: "tfm_its_partition", name: "tfm-its", start: 0x000F4000, size: 8K }
        - { id: "tfm_otp_partition", name: "tfm-otp", start: 0x000F6000, size: 8K }
        - { id: "storage_partition", name: "storage", start: 0x000F8000, size: 32K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash0_col", root: "flash0", title: "flash0\n1 MB of 1 MB (100%)", width: 150 }
    - { id: "slot0_partition_col", root: "slot0_partition", width: 150 }
    - { id: "slot1_partition_col", root: "slot1_partition", width: 150 }
  expand:
    - { region: "slot0_partition", to: "slot0_partition_col", title: "image-0 in flash0" }
    - { region: "slot1_partition", to: "slot1_partition_col", title: "image-1 in flash0" }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false  # erase blocks are too many to mark
