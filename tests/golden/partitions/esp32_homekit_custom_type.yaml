# Generated by `memmap from-partitions` from partitions.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 4 MB, from CONFIG_ESPTOOLPY_FLASHSIZE in sdkconfig.
# Partition table at 0x8000, from CONFIG_PARTITION_TABLE_OFFSET in sdkconfig.
# Bootloader at 0x1000, from CONFIG_IDF_TARGET esp32 in sdkconfig.
version: 1

figure:
  title: "partitions.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 4M
      sectors: { size: 4K, count: 1024 }  # checks alignment (W100)
      children:
        - { id: "reserved", name: "Reserved", kind: reserved, start: 0x00000000, size: 4K }
        - { id: "bootloader", name: "Bootloader", start: 0x00001000, size: 28K }
        - { id: "partition_table", name: "Partition table", start: 0x00008000, size: 4K }
        - { id: "free", name: "Free\n16 KB", kind: reserved, start: 0x00009000, size: 16K }
        - { id: "sec_cert", name: "sec_cert", start: 0x0000D000, size: 12K, note: "0x3f" }
        - { id: "nvs", name: "nvs", start: 0x00010000, size: 24K, note: "data, nvs" }
        - { id: "otadata", name: "otadata", start: 0x00016000, size: 8K, note: "data, ota" }
        - { id: "phy_init", name: "phy_init", start: 0x00018000, size: 4K, note: "data, phy" }
        - { id: "free_2", name: "Free\n28 KB", kind: reserved, start: 0x00019000, size: 28K }
        - { id: "ota_0", name: "ota_0", start: 0x00020000, size: 1600K, note: "app, ota_0" }
        - { id: "ota_1", name: "ota_1", start: 0x001B0000, size: 1600K, note: "app, ota_1" }
        - { id: "factory_nvs", name: "factory_nvs", start: 0x00340000, size: 24K, note: "data, nvs" }
        - { id: "nvs_keys", name: "nvs_keys", start: 0x00346000, size: 4K, note: "data, nvs_keys" }
        - { id: "free_3", name: "Free\n740 KB", kind: reserved, start: 0x00347000, size: 740K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n3.2 MB of 4 MB (81%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
