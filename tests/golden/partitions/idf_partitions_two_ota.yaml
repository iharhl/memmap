# Generated by `memmap from-partitions` from idf_partitions_two_ota.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 4 MB, from --flash-size.
# Partition table at 0x8000, from the default.
# Bootloader at 0x1000, from CONFIG_IDF_TARGET esp32 in sdkconfig.
version: 1

figure:
  title: "idf_partitions_two_ota.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 4M
      sectors: { size: 4K, count: 1024 }  # checks alignment (W100)
      children:
        - { id: "reserved", name: "Reserved", kind: reserved, start: 0x00000000, size: 4K }
        - { id: "bootloader", name: "Bootloader", start: 0x00001000, size: 28K }
        - { id: "partition_table", name: "Partition table", start: 0x00008000, size: 4K }
        - { id: "nvs", name: "nvs", start: 0x00009000, size: 16K, note: "data, nvs" }
        - { id: "otadata", name: "otadata", start: 0x0000D000, size: 8K, note: "data, ota" }
        - { id: "phy_init", name: "phy_init", start: 0x0000F000, size: 4K, note: "data, phy" }
        - { id: "factory", name: "factory", start: 0x00010000, size: 1M, note: "app, factory" }
        - { id: "ota_0", name: "ota_0", start: 0x00110000, size: 1M, note: "app, ota_0" }
        - { id: "ota_1", name: "ota_1", start: 0x00210000, size: 1M, note: "app, ota_1" }
        - { id: "free", name: "Free\n960 KB", kind: reserved, start: 0x00310000, size: 960K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n3.1 MB of 4 MB (76%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
