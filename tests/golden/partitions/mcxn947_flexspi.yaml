# Generated by `memmap from-partitions` from zephyr.dts, a Zephyr devicetree.
# Each flash with fixed partitions is a region at the address its reg gives. A flash on a
# SPI or QSPI bus has no CPU address, so its offsets are positions in the chip, from 0.
# Rename, merge or annotate blocks freely.
# flash, /soc/peripheral@50000000/flash-controller@43000/flash@0: 2 MB at 0x10000000, from its reg; 8 KB erase blocks.
# w25q64jvssiq, /soc/spi@500c8000/w25q64jvssiq@0: 8 MB at 0x0, from its size property in bits, drawn from 0 as the CPU does not map it; 4 KB erase blocks.
version: 1

figure:
  title: "zephyr.dts flash layout"

memory:
  regions:
    - id: "flash"
      name: "flash"
      start: 0x10000000
      size: 2M
      sectors: { size: 8K, count: 256 }  # checks alignment (W100)
      children:
        - { id: "boot_partition", name: "mcuboot", start: 0x10000000, size: 80K, note: "MCUboot" }
        - { id: "slot0_partition", name: "image-0", start: 0x10014000, size: 984K, note: "MCUboot primary slot, code partition" }
        - { id: "slot1_partition", name: "image-1", start: 0x1010A000, size: 984K, note: "MCUboot secondary slot" }
    - id: "w25q64jvssiq"
      name: "w25q64jvssiq"
      space: "w25q64jvssiq"  # offsets in the chip, not CPU addresses
      start: 0x00000000
      size: 8M
      sectors: { size: 4K, count: 2048 }  # checks alignment (W100)
      children:
        - { id: "storage_partition", name: "storage", start: 0x00000000, size: 8M }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "flash\n2 MB of 2 MB (100%)", width: 150 }
    - { id: "w25q64jvssiq_col", root: "w25q64jvssiq", title: "w25q64jvssiq\n8 MB of 8 MB (100%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false  # erase blocks are too many to mark
