# Generated by `memmap from-partitions` from partitions.yml, an nRF Connect SDK Partition Manager file.
# The file does not give the size of a region, so each is drawn from its lowest to its
# highest partition. Containers (span) are zoomed into.
# Rename, merge or annotate blocks freely.
# flash_primary: 1 MB from 0x0.
# external_flash: 8 MB from 0x0, on MX25R64.
# sram_primary: 512 KB from 0x20000000.
# otp: 764 B from 0xff8100.
# ram_flash: 256 KB from 0x0, on flash_ctrl.
# tfm_secure (0x10000 - 0x1bfff) partly overlaps mcuboot_primary_app (0x10200 - 0xeffff), so it is not drawn.
# ram_flash overlaps another region, so it gets an address space of its own.
# ram_flash has size 0, so it is not drawn.
version: 1

figure:
  title: "partitions.yml memory layout"

memory:
  regions:
    - id: "flash_primary"
      name: "Flash"
      start: 0x00000000
      size: 1M
      children:
        - { id: "mcuboot", name: "mcuboot", start: 0x00000000, size: 64K, note: "MCUboot" }
        - id: "mcuboot_primary"
          name: "mcuboot_primary"
          start: 0x00010000
          size: 896K
          note: "MCUboot primary slot"
          children:
            - { id: "mcuboot_pad", name: "mcuboot_pad", start: 0x00010000, size: 512, note: "MCUboot image header" }
            - id: "mcuboot_primary_app"
              name: "mcuboot_primary_app"
              start: 0x00010200
              size: 916992
              note: "image in the primary slot"
              children:
                - { id: "tfm", name: "tfm", start: 0x00010200, size: 48640, note: "TF-M" }
                - { id: "app", name: "app", start: 0x0001C000, size: 848K, note: "application; also tfm_nonsecure" }
        - { id: "settings_storage", name: "settings_storage", start: 0x000F0000, size: 64K, note: "Zephyr settings; also nonsecure_storage" }
    - id: "external_flash"
      name: "External flash"
      space: "external_flash"  # offsets in the chip, not CPU addresses
      start: 0x00000000
      size: 8M
      children:
        - { id: "mcuboot_secondary", name: "mcuboot_secondary", start: 0x00000000, size: 896K, note: "MCUboot secondary slot" }
        - { id: "mcuboot_secondary_1", name: "mcuboot_secondary_1", start: 0x000E0000, size: 256K, note: "MCUboot secondary slot, image 1" }
        - { id: "external_flash_2", name: "external_flash", start: 0x00120000, size: 7040K }
    - id: "sram_primary"
      name: "SRAM"
      start: 0x20000000
      size: 512K
      children:
        - { id: "pcd_sram", name: "pcd_sram", start: 0x20000000, size: 8K }
        - id: "mcuboot_sram"
          name: "mcuboot_sram"
          start: 0x20002000
          size: 504K
          children:
            - { id: "tfm_sram", name: "tfm_sram", start: 0x20002000, size: 32K, note: "also sram_secure" }
            - id: "sram_nonsecure"
              name: "sram_nonsecure"
              start: 0x2000A000
              size: 472K
              children:
                - { id: "sram_primary_2", name: "sram_primary", start: 0x2000A000, size: 408K }
                - { id: "rpmsg_nrf53_sram", name: "rpmsg_nrf53_sram", start: 0x20070000, size: 64K }
    - id: "otp"
      name: "OTP"
      start: 0x00FF8100
      size: 764
      children:
        - { id: "otp_2", name: "otp", start: 0x00FF8100, size: 764 }
    - id: "ram_flash"
      name: "ram_flash"
      space: "ram_flash"  # overlaps another region
      start: 0x00000000
      size: 256K
      children:
        - { id: "mcuboot_primary_1", name: "mcuboot_primary_1", start: 0x00000000, size: 256K, note: "MCUboot primary slot, image 1" }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_primary_col", root: "flash_primary", title: "Flash\n1 MB of 1 MB (100%)", width: 150 }
    - { id: "mcuboot_primary_col", root: "mcuboot_primary", width: 150 }
    - { id: "mcuboot_primary_app_col", root: "mcuboot_primary_app", width: 150 }
    - { id: "external_flash_col", root: "external_flash", title: "External flash\n8 MB of 8 MB (100%)", width: 150 }
    - { id: "sram_primary_col", root: "sram_primary", title: "SRAM\n512 KB of 512 KB (100%)", width: 150 }
    - { id: "mcuboot_sram_col", root: "mcuboot_sram", width: 150 }
    - { id: "sram_nonsecure_col", root: "sram_nonsecure", width: 150 }
    - { id: "otp_col", root: "otp", title: "OTP\n764 B of 764 B (100%)", width: 150 }
    - { id: "ram_flash_col", root: "ram_flash", title: "ram_flash\n256 KB of 256 KB (100%)", width: 150 }
  expand:
    - { region: "mcuboot_primary", to: "mcuboot_primary_col", title: "mcuboot_primary in Flash" }
    - { region: "mcuboot_primary_app", to: "mcuboot_primary_app_col", title: "mcuboot_primary_app in mcuboot_primary" }
    - { region: "mcuboot_sram", to: "mcuboot_sram_col", title: "mcuboot_sram in SRAM" }
    - { region: "sram_nonsecure", to: "sram_nonsecure_col", title: "sram_nonsecure in mcuboot_sram" }

style:
  reserved: { show_label: true }  # names the Free blocks
