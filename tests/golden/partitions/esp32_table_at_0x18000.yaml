# Generated by `memmap from-partitions` from idf_partitions_singleapp.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 2 MB, from CONFIG_ESPTOOLPY_FLASHSIZE in sdkconfig.
# Partition table at 0x18000, from CONFIG_PARTITION_TABLE_OFFSET in sdkconfig.
# Bootloader at 0x1000, from CONFIG_IDF_TARGET esp32 in sdkconfig.
version: 1

figure:
  title: "idf_partitions_singleapp.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 2M
      sectors: { size: 4K, count: 512 }  # checks alignment (W100)
      children:
        - { id: "reserved", name: "Reserved", kind: reserved, start: 0x00000000, size: 4K }
        - { id: "bootloader", name: "Bootloader", start: 0x00001000, size: 92K }
        - { id: "partition_table", name: "Partition table", start: 0x00018000, size: 4K }
        - { id: "nvs", name: "nvs", start: 0x00019000, size: 24K, note: "data, nvs" }
        - { id: "phy_init", name: "phy_init", start: 0x0001F000, size: 4K, note: "data, phy" }
        - { id: "factory", name: "factory", start: 0x00020000, size: 1M, note: "app, factory" }
        - { id: "free", name: "Free\n896 KB", kind: reserved, start: 0x00120000, size: 896K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n1.1 MB of 2 MB (56%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
