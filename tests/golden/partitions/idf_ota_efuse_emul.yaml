# Generated by `memmap from-partitions` from idf_ota_efuse_emul.csv, an ESP-IDF partition table.
# Offsets are positions in the flash chip, not CPU addresses. Rename, merge or annotate
# blocks freely.
# Flash size 4 MB, from --flash-size.
# Partition table at 0x8000, from the default.
# Bootloader at 0x1000, from CONFIG_IDF_TARGET esp32 in sdkconfig.
version: 1

figure:
  title: "idf_ota_efuse_emul.csv flash layout"

memory:
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 4M
      sectors: { size: 4K, count: 1024 }  # checks alignment (W100)
      children:
        - { id: "reserved", name: "Reserved", kind: reserved, start: 0x00000000, size: 4K }
        - { id: "primarybtldr", name: "PrimaryBTLDR", start: 0x00001000, size: 28K, note: "bootloader, primary" }
        - { id: "primaryprttable", name: "PrimaryPrtTable", start: 0x00008000, size: 4K, note: "partition_table, primary" }
        - { id: "nvs", name: "nvs", start: 0x00009000, size: 24K, note: "data, nvs" }
        - { id: "nvs_key", name: "nvs_key", start: 0x0000F000, size: 4K, note: "data, nvs_keys" }
        - { id: "storage", name: "storage", start: 0x00010000, size: 4K, note: "data, encrypted" }
        - { id: "otadata", name: "otadata", start: 0x00011000, size: 8K, note: "data, ota" }
        - { id: "phy_init", name: "phy_init", start: 0x00013000, size: 4K, note: "data, phy" }
        - { id: "emul_efuse", name: "emul_efuse", start: 0x00014000, size: 8K, note: "data, efuse" }
        - { id: "free", name: "Free\n40 KB", kind: reserved, start: 0x00016000, size: 40K }
        - { id: "ota_0", name: "ota_0", start: 0x00020000, size: 1728K, note: "app, ota_0" }
        - { id: "ota_1", name: "ota_1", start: 0x001D0000, size: 1728K, note: "app, ota_1" }
        - { id: "free_2", name: "Free\n512 KB", kind: reserved, start: 0x00380000, size: 512K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n3.5 MB of 4 MB (86%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
  sector_ticks: false             # 4K sectors are too many to mark
