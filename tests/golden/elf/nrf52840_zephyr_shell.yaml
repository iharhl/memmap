# Generated by `memmap from-elf` from nrf52840_zephyr_shell.elf. Section ranges come from
# the ELF and memory regions from --region. Rename, merge or annotate blocks freely.
version: 1

figure:
  title: "nrf52840_zephyr_shell.elf memory map"

memory:
  fill_gaps: none                   # gaps under --min-size show as a split edge
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x00000000
      size: 1M
      children:
        - { id: "rom_start", name: "rom_start", start: 0x00000000, size: 256 }
        - { id: "text", name: "text", start: 0x00000100, size: 49376 }
        - { id: "arm_exidx", name: ".ARM.exidx", start: 0x0000C1E0, size: 8 }
        - { id: "initlevel", name: "initlevel", start: 0x0000C1E8, size: 120 }
        - { id: "sw_isr_table", name: "sw_isr_table", start: 0x0000C260, size: 384 }
        - { id: "log_const_sections", name: "log_const_sections", start: 0x0000C3E0, size: 96 }
        - id: "small_sections"
          name: "2 small sections"
          start: 0x0000C440
          size: 80
          children:
            - { id: "log_backends_sections", name: "log_backends_sections", start: 0x0000C440, size: 32 }
            - { id: "shell_area", name: "shell_area", start: 0x0000C460, size: 48 }
        - { id: "shell_root_cmds_sections", name: "shell_root_cmds_sections", start: 0x0000C490, size: 112 }
        - { id: "rodata", name: "rodata", start: 0x0000C500, size: 10936 }
        - { id: "ram_init_data", name: "RAM init data", start: 0x0000EFB8, size: 676, note: "copied to 0x2000 0000: datas, devices, log_dynamic_sections, k_timer_area, k_mutex_area, k_msgq_area, +1 more" }
        - { id: "flash_free", name: "Free\n≈963 KB", kind: reserved, start: 0x0000F25C, size: 986532 }
    - id: "ram"
      name: "RAM"
      start: 0x20000000
      size: 256K
      children:
        - { id: "datas", name: "datas", start: 0x20000000, size: 372 }
        - { id: "devices", name: "devices", start: 0x20000174, size: 116 }
        - id: "small_sections_2"
          name: "5 small sections"
          start: 0x200001E8
          size: 188
          children:
            - { id: "log_dynamic_sections", name: "log_dynamic_sections", start: 0x200001E8, size: 48 }
            - { id: "k_timer_area", name: "k_timer_area", start: 0x20000218, size: 56 }
            - { id: "k_mutex_area", name: "k_mutex_area", start: 0x20000250, size: 20 }
            - { id: "k_msgq_area", name: "k_msgq_area", start: 0x20000264, size: 40 }
            - { id: "k_sem_area", name: "k_sem_area", start: 0x2000028C, size: 24 }
        - { id: "bss", name: "bss", start: 0x200002A8, size: 4142 }
        - { id: "noinit", name: "noinit", start: 0x200012E0, size: 8144 }
        - { id: "ram_free", name: "Free\n≈243 KB", kind: reserved, start: 0x200032B0, size: 249168 }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n60.6 KB of 1 MB (6%)", width: 150 }
    - { id: "ram_col", root: "ram", title: "RAM\n12.7 KB of 256 KB (5%)", width: 150 }
    - { id: "small_sections_col", root: "small_sections", width: 150 }
    - { id: "small_sections_2_col", root: "small_sections_2", width: 150 }
  expand:
    - { region: "small_sections", to: "small_sections_col", title: "2 small sections in Flash" }
    - { region: "small_sections_2", to: "small_sections_2_col", title: "5 small sections in RAM" }

style:
  reserved: { show_label: true }  # names the Free blocks
