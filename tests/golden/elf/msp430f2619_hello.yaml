# Generated by `memmap from-elf` from msp430f2619_hello.elf. Section ranges come from
# the ELF and memory regions from --region. Rename, merge or annotate blocks freely.
version: 1

figure:
  title: "msp430f2619_hello.elf memory map"

memory:
  fill_gaps: none                   # gaps under --min-size show as a split edge
  regions:
    - id: "ram"
      name: "RAM"
      start: 0x00001100
      size: 4K
      children:
        - { id: "bss", name: ".bss", start: 0x00001100, size: 2 }
        - { id: "heap", name: ".heap", start: 0x00001102, size: 4 }
        - { id: "ram_free", name: "Free\n≈3.99 KB", kind: reserved, start: 0x00001106, size: 4090 }
    - id: "flash"
      name: "Flash"
      start: 0x00002100
      size: 122624
      children:
        - { id: "rodata", name: ".rodata", start: 0x00002100, size: 80 }
        - { id: "lowtext", name: ".lowtext", start: 0x00002150, size: 24 }
        - { id: "text", name: ".text", start: 0x00002168, size: 480 }
        - { id: "flash_free", name: "Free\n≈55.1 KB", kind: reserved, start: 0x00002348, size: 56502 }
        - { id: "reset_vector", name: "__reset_vector", start: 0x0000FFFE, size: 2 }
        - { id: "flash_free_2", name: "Free\n64 KB", kind: reserved, start: 0x00010000, size: 64K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "ram_col", root: "ram", title: "RAM\n6 B of 4 KB (<1%)", width: 150 }
    - { id: "flash_col", root: "flash", title: "Flash\n586 B of 119.8 KB (<1%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
