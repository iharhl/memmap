# Generated by `memmap from-elf` from rp2040_pico_rom.elf. Section ranges come from
# the ELF and memory regions from --region. Rename, merge or annotate blocks freely.
version: 1

figure:
  title: "rp2040_pico_rom.elf memory map"

memory:
  fill_gaps: none                   # gaps under --min-size show as a split edge
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x10000000
      size: 2M
      children:
        - { id: "boot2", name: ".boot2", start: 0x10000000, size: 256 }
        - { id: "text", name: ".text", start: 0x10000100, size: 23248 }
        - { id: "rodata", name: ".rodata", start: 0x10005BD0, size: 248 }
        - { id: "binary_info", name: ".binary_info", start: 0x10005CC8, size: 32 }
        - { id: "data_load", name: ".data (load)", start: 0x10005CE8, size: 380, note: "copied to RAM at 0x2000 00C0" }
        - { id: "flash_free", name: "Free\n≈1.97 MB", kind: reserved, start: 0x10005E64, size: 2072988 }
    - id: "ram"
      name: "RAM"
      start: 0x20000000
      size: 256K
      children:
        - { id: "ram_vector_table", name: ".ram_vector_table", start: 0x20000000, size: 192, note: "not allocated in the ELF, as a (COPY) section" }
        - { id: "data", name: ".data", start: 0x200000C0, size: 380 }
        - { id: "bss", name: ".bss", start: 0x20000240, size: 33736 }
        - { id: "heap", name: ".heap", start: 0x20008608, size: 2K, note: "not allocated in the ELF, as a (COPY) section" }
        - { id: "ram_free", name: "Free\n≈220 KB", kind: reserved, start: 0x20008E08, size: 225784 }
    - id: "scratch_x"
      name: "SCRATCH_X"
      start: 0x20040000
      size: 4K
      children:
        - { id: "scratch_x_free", name: "Free\n4 KB", kind: reserved, start: 0x20040000, size: 4K }
    - id: "scratch_y"
      name: "SCRATCH_Y"
      start: 0x20041000
      size: 4K
      children:
        - { id: "stack_dummy", name: ".stack_dummy", start: 0x20041000, size: 2K, note: "not allocated in the ELF, as a (COPY) section" }
        - { id: "scratch_y_free", name: "Free\n2 KB", kind: reserved, start: 0x20041800, size: 2K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n23.6 KB of 2 MB (1%)", width: 150 }
    - { id: "ram_col", root: "ram", title: "RAM\n35.5 KB of 256 KB (14%)", width: 150 }
    - { id: "scratch_x_col", root: "scratch_x", title: "SCRATCH_X\n0 B of 4 KB (0%)", width: 150 }
    - { id: "scratch_y_col", root: "scratch_y", title: "SCRATCH_Y\n2 KB of 4 KB (50%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
