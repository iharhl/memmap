# Generated by `memmap from-elf` from hubris_stm32h753.elf. Section ranges come from
# the ELF and memory regions from --region. Rename, merge or annotate blocks freely.
version: 1

figure:
  title: "hubris_stm32h753.elf memory map"

memory:
  fill_gaps: none                   # gaps under --min-size show as a split edge
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x08000000
      size: 2M
      children:
        - { id: "sec1", name: ".sec1", start: 0x08000000, size: 128K }
        - { id: "flash_free", name: "Free\n1920 KB", kind: reserved, start: 0x08020000, size: 1920K }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n128 KB of 2 MB (6%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
