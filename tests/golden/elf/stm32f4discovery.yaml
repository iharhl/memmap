# Generated by `memmap from-elf` from stm32f4discovery.elf. Section ranges come from
# the ELF and memory regions from --region. Rename, merge or annotate blocks freely.
version: 1

figure:
  title: "stm32f4discovery.elf memory map"

memory:
  fill_gaps: none                   # gaps under --min-size show as a split edge
  regions:
    - id: "flash"
      name: "Flash"
      start: 0x08000000
      size: 1M
      children:
        - { id: "isr_vector", name: ".isr_vector", start: 0x08000000, size: 392 }
        - { id: "text", name: ".text", start: 0x08000188, size: 77680 }
        - { id: "arm", name: ".ARM", start: 0x080130F8, size: 8 }
        - { id: "data_load", name: ".data (load)", start: 0x08013100, size: 2716, note: "copied to SRAM at 0x2000 0000" }
        - { id: "flash_free", name: "Free\n≈945 KB", kind: reserved, start: 0x08013B9C, size: 967780 }
    - id: "sram"
      name: "SRAM"
      start: 0x20000000
      size: 128K
      children:
        - { id: "data", name: ".data", start: 0x20000000, size: 2716 }
        - { id: "bss", name: ".bss", start: 0x20000A9C, size: 22212 }
        - { id: "user_heap_stack", name: "._user_heap_stack", start: 0x20006160, size: 1K }
        - { id: "sram_free", name: "Free\n≈102 KB", kind: reserved, start: 0x20006560, size: 105120 }

view:
  defaults:
    labels: { size: true }
  columns:
    - { id: "flash_col", root: "flash", title: "Flash\n78.9 KB of 1 MB (8%)", width: 150 }
    - { id: "sram_col", root: "sram", title: "SRAM\n25.3 KB of 128 KB (20%)", width: 150 }

style:
  reserved: { show_label: true }  # names the Free blocks
